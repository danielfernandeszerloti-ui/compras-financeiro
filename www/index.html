<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#212f96">
<title>Solicitações de Compra · Grupo Zerbini</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<style>
/* Mesmo visual da Gestão de Ativos: sidebar à esquerda, cabeçalho, cartões; vira barra superior no celular */
:root{
  --bg:#f3f5fb; --glow:#e4e8fb; --surface:#ffffff; --surface-2:#f6f7fd; --border:#dfe3f0; --row:#eef0f8;
  --ink:#1a2035; --heading:#16215e; --muted:#5d6584; --faint:#8a91aa;
  --accent:#4be0db; --accent-2:#212f96; --accent-soft:#e8eafc; --pink:#f9518d;
  --use-bg:#e4e8ff; --use-fg:#26339a; --use-bd:#bcc5f5;
  --avail-bg:#daf6f5; --avail-fg:#0a7a80; --avail-bd:#9fe3e0;
  --maint-bg:#fff2da; --maint-fg:#955800; --maint-bd:#f3d49a;
  --disc-bg:#eff0f4; --disc-fg:#646a78; --disc-bd:#d5d8e0;
  --res-bg:#f2eaff; --res-fg:#6d28d9; --res-bd:#d8c4fb;
  --ok-bg:#e2f6e9; --ok-fg:#13743a; --ok-bd:#a7dfba;
  --bad-bg:#fdecec; --bad-fg:#b42323; --bad-bd:#f3b9b9;
  --danger:#cf3535; --danger-soft:#fdecec; --shadow:0 6px 24px rgba(22,33,94,.07);
  --f-ui:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0b0f1f; --glow:#141b3a; --surface:#121831; --surface-2:#171e3b; --border:#262f55; --row:#1b2345;
  --ink:#e3e7f7; --heading:#d3dafc; --muted:#98a0c2; --faint:#6f78a0;
  --accent:#4be0db; --accent-2:#8b98ff; --accent-soft:#1d2550; --pink:#ff6fa3;
  --use-bg:#1d2657; --use-fg:#c1caff; --use-bd:#323e82;
  --avail-bg:#0e3336; --avail-fg:#6fe0dd; --avail-bd:#1c5a5c;
  --maint-bg:#3a2a0e; --maint-fg:#f3c66e; --maint-bd:#654a1b;
  --disc-bg:#20242d; --disc-fg:#a4a9b6; --disc-bd:#343a47;
  --res-bg:#2a1d48; --res-fg:#cdb5ff; --res-bd:#4b3680;
  --ok-bg:#0f3120; --ok-fg:#7ddc9f; --ok-bd:#1f5a37;
  --bad-bg:#3a1a1d; --bad-fg:#ff9b9b; --bad-bd:#6b2a30;
  --danger:#f07575; --danger-soft:#3a1a1d; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);background-image:radial-gradient(1200px 500px at 85% -10%,var(--glow),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
select,input,textarea{background-color:var(--surface)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
a{color:var(--accent-2)}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--border);background:color-mix(in srgb,var(--surface) 75%,transparent);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px;border-bottom:1px solid var(--border)}
.logo{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:#fff;border:1px solid var(--border)}
.logo img{width:36px;height:36px}
.brand b{display:block;color:var(--heading);font-size:16.5px;font-weight:800;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px}
.bar3{height:3px;background:linear-gradient(90deg,var(--accent),#212f96,var(--pink))}
.navlabel{padding:18px 20px 6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.navs{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--heading);font-weight:600;text-align:left;border-left:3px solid transparent;width:100%}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);border-left-color:var(--accent-2);color:var(--accent-2);font-weight:800}
.nav .n{margin-left:auto;font-size:12px;font-weight:800;background:var(--pink);color:#fff;border-radius:20px;padding:1px 8px;font-variant-numeric:tabular-nums}
.nav .n.soft{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.me{margin-top:auto;padding:12px 12px 12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;min-width:38px;border-radius:50%;flex:0 0 38px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:800;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.me .who{min-width:0;flex:1 1 auto}
.me .who b{display:block;font-size:14px;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .tools{display:flex;gap:2px;flex:none}
.me .ib{width:34px;height:34px}
.ib{width:36px;height:36px;border-radius:8px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.ib:hover{background:var(--accent-soft);color:var(--accent-2)}

main{padding-block:30px 60px;padding-inline:clamp(14px,3.5vw,48px);min-width:0}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
h1{margin:0;color:var(--heading);font-size:clamp(26px,3.2vw,36px);font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:16px;margin-top:4px}
.actions,.rowacts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--accent-2);font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent-2)}
.btn.primary{background:linear-gradient(90deg,#2b3bb5,#212f96);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(33,47,150,.22)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:#16884a;border-color:transparent;color:#fff}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn.ghost{color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:14px;gap:6px}
.btn:disabled{opacity:.55;cursor:wait}
.linkbtn{border:0;background:none;color:var(--accent-2);font-weight:700;cursor:pointer;padding:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.panel{padding:20px 22px;margin-bottom:18px}
.panel h2{margin:0;font-size:17px;color:var(--heading);font-weight:800}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 14px}
.warnnote{background:var(--maint-bg);color:var(--maint-fg);border:1px solid var(--maint-bd);border-radius:10px;padding:10px 13px;font-size:14px}
.badnote{background:var(--bad-bg);color:var(--bad-fg);border:1px solid var(--bad-bd);border-radius:10px;padding:10px 13px;font-size:14px}
.oknote{background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-bd);border-radius:10px;padding:10px 13px;font-size:14px}

.pill{display:inline-block;padding:2px 11px;border-radius:7px;font-size:13px;font-weight:700;border:1px solid;white-space:nowrap}
.st-sol{background:var(--use-bg);color:var(--use-fg);border-color:var(--use-bd)}
.st-prep{background:var(--avail-bg);color:var(--avail-fg);border-color:var(--avail-bd)}
.st-res{background:var(--res-bg);color:var(--res-fg);border-color:var(--res-bd)}
.st-man{background:var(--maint-bg);color:var(--maint-fg);border-color:var(--maint-bd)}
.st-ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}
.st-bad{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-bd)}
.st-desc{background:var(--disc-bg);color:var(--disc-fg);border-color:var(--disc-bd)}
.chip{font-size:12px;font-weight:800;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-2);white-space:nowrap}
.chip.urg{background:var(--bad-bg);color:var(--bad-fg)}

.filters{display:flex;flex-wrap:wrap;gap:12px;padding:16px 18px;margin-bottom:18px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:9px;padding:0 12px;background:var(--surface);min-width:0}
.search svg{color:var(--accent-2)}
.search input{border:0;outline:0;background:none;padding:10px 0;width:100%;min-width:0}
.filters select{border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-weight:600;flex:0 1 210px;min-width:0}

/* cartões de solicitação */
.sols{display:flex;flex-direction:column;gap:10px}
.sc{padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;cursor:pointer;border-left:4px solid transparent}
.sc:hover{border-color:var(--accent-2)}
.sc.urg{border-left-color:var(--pink)}
.sc .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;color:var(--heading);font-size:16px}
.sc .t .cod{color:var(--muted);font-weight:700;font-size:14px}
.sc .m{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.sc .v{text-align:right;font-weight:800;color:var(--heading);font-variant-numeric:tabular-nums;white-space:nowrap}
.sc .v small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.sc .nx{grid-column:1/-1;font-size:13.5px;color:var(--accent-2);font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sc .nx .late{color:var(--danger)}
.sc .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--heading);font-size:18px;margin-bottom:6px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.tile{padding:16px 18px;cursor:pointer;text-align:left;border:1px solid var(--border)}
.tile:hover{border-color:var(--accent-2)}
.tile .ti{color:var(--muted);font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.tile .big{font-size:32px;font-weight:800;color:var(--heading);font-variant-numeric:tabular-nums;line-height:1.15}
.tile .mini{font-size:13px;color:var(--muted)}
.tile.hot .big{color:var(--pink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.al{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--row);cursor:pointer;font-size:14px}
.al:last-child{border-bottom:0}
.al i{width:8px;height:8px;border-radius:50%;background:var(--maint-fg);flex:none}
.al.late i{background:var(--danger)}
.al b{color:var(--heading)}
.al span{color:var(--muted);flex:1;min-width:0}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:14px;margin-top:8px}
.bar .tr{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.bar .tr span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#212f96)}
.bar b{text-align:right;font-variant-numeric:tabular-nums;color:var(--heading)}

.tablewrap{overflow-x:auto;border-radius:14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:700;color:var(--muted);font-size:14px;padding:12px 10px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--row);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,40,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(860px,100%);padding:24px 26px;position:relative}
.modal.sm{width:min(540px,100%)}
.modal h2{margin:0 0 14px;font-size:22px;color:var(--heading);font-weight:800;padding-right:40px}
.modal .x{position:absolute;right:14px;top:14px}
.foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.f{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>span{font-size:13.5px;font-weight:700;color:var(--muted)}
.fld>span i{color:var(--danger);font-style:normal}
.fld input,.fld select,.fld textarea{border:1px solid var(--border);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{min-height:80px;resize:vertical}
.fld small{color:var(--faint);font-size:12.5px}
.check{display:flex;gap:9px;align-items:center;font-size:14.5px;cursor:pointer;font-weight:600}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg label{flex:1;text-align:center;padding:9px 10px;cursor:pointer;font-weight:700;color:var(--muted);font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-2);color:#fff}
.itens{display:flex;flex-direction:column;gap:10px}
.itrow{display:grid;grid-template-columns:minmax(0,2.4fr) 70px 120px minmax(0,1.3fr) 36px;gap:8px;align-items:end;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.itrow .fld>span{font-size:12px}
.itrow .lk{grid-column:1/-2}
.itot{text-align:right;font-weight:800;color:var(--heading)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px;margin-bottom:16px}
.kv label{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.kv p{margin:0;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.blk{margin:16px 0 0}
.blk>label{display:block;color:var(--muted);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.txt{white-space:pre-wrap;margin:0}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;font-size:14px}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--heading)}
.file .nm button{all:unset;cursor:pointer;color:var(--accent-2)}
.file small{color:var(--muted)}
.file.rec{opacity:.6}.file.rec .nm{text-decoration:line-through}
.drop{border:2px dashed var(--border);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.drop:hover,.drop.on{border-color:var(--accent-2);color:var(--accent-2);background:var(--accent-soft)}
.drop input{display:none}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.hist li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px}
.hist time{color:var(--faint);font-variant-numeric:tabular-nums}
.hist em{font-style:normal;color:var(--muted)}
.steps{display:flex;gap:4px;margin:2px 0 16px;flex-wrap:wrap}
.steps span{flex:1 1 90px;font-size:12px;font-weight:700;color:var(--faint);border-top:4px solid var(--border);padding-top:5px}
.steps span.done{color:var(--ok-fg);border-color:#22a35a}
.steps span.cur{color:var(--accent-2);border-color:var(--accent-2)}
.steps span.bad{color:var(--danger);border-color:var(--danger)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--heading);color:var(--surface);padding:12px 20px;border-radius:10px;font-weight:700;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* login */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .card{width:min(420px,100%);padding:30px 28px;display:flex;flex-direction:column;gap:14px;overflow:hidden;position:relative}
.gate .card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--accent),#212f96,var(--pink))}
.gate h2{margin:4px 0 0;color:var(--heading);font-size:22px}
.gate p{margin:0;color:var(--muted);font-size:14.5px}
.gate input{border:1px solid var(--border);border-radius:9px;padding:12px 14px;font-size:16px}
.gate input.code{letter-spacing:.3em;text-align:center;font-weight:800;font-size:22px}
.gate .err{color:var(--danger);font-weight:700;font-size:14px}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted);font-weight:700}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:20;min-width:0;max-width:100vw;flex-direction:row;flex-wrap:wrap;align-items:center;overflow:visible}
  .brand{border:0;padding:10px 12px;flex:1 1 0;min-width:0}.brand>div{min-width:0}.brand small{display:none}
  .brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar3,.navlabel{display:none}
  .navs{flex-direction:row;overflow-x:auto;order:3;width:100%;padding:0 8px 8px;gap:4px}
  .nav{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px;padding:8px 10px}
  .nav.on{border-bottom-color:var(--accent-2)}
  .me{margin:0 0 0 auto;border:0;padding:8px 10px 8px 0;flex:none}.me .who{display:none}
  .grid2,.kv{grid-template-columns:1fr 1fr}
  .itrow{grid-template-columns:minmax(0,1fr) 70px 110px 36px}.itrow .forn{grid-column:1/-2}
}
@media (max-width:600px){
  .fgrid,.grid2,.kv{grid-template-columns:1fr}
  .sc{grid-template-columns:1fr}.sc .v{text-align:left}
  .itrow{grid-template-columns:minmax(0,1fr) 64px 36px}.itrow .vu{grid-column:1/-2}
  .modal{padding:20px 16px}
  .me .av{display:none}
  .hist li{grid-template-columns:1fr}
  .bar{grid-template-columns:90px minmax(0,1fr) 90px}
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></symbol>
